[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tornix-cli"
version = "0.1.0"
description = "Agent-native CLI for the Tornix PMO platform (app.tornix.ai)"
requires-python = ">=3.11"
dependencies = [
  "click>=8.1",
  "httpx>=0.27",
  "rich>=13.7",
  "tomli-w>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-httpx>=0.30"]

[project.scripts]
tornix = "tornix_cli.__main__:main"

[tool.setuptools.packages.find]
include = ["tornix_cli*"]

[tool.setuptools.package-data]
"tornix_cli.generated" = ["_spec.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
